openapi: 3.0.3
info:
  title: Mini
  version: "1"
servers:
  - url: https://dealer.flyfisheurope.com
tags:
  - name: brands
  - name: login
  - name: pos-sales
paths:
  /login/:
    post:
      tags: [login]
      operationId: login
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              email: you@example.com
              pass: secret
      responses:
        "200":
          description: ok
  /api/pos/sales/:
    post:
      tags: [pos-sales]
      operationId: addSale
      summary: Add sale
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: created
  /api/brands/:
    get:
      tags: [brands]
      operationId: listBrands
      summary: List brands
      x-sdk-node: "ffe.brands()"
      x-sdk-php: "$ffe->brands()"
      responses:
        "200":
          description: Array of brands
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Brand" } }
              example:
                - brandno: simms
                  name: Simms
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/brands/{brandno}:
    get:
      tags: [brands]
      operationId: getBrand
      summary: Get one brand
      x-sdk-node: "ffe.brand('simms')"
      x-sdk-php: "$ffe->brand('simms')"
      parameters:
        - name: brandno
          in: path
          required: true
          schema: { type: string }
          example: simms
          description: Brand id
      responses:
        "200":
          description: The brand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brand" }
              examples:
                found:
                  summary: Brand found
                  value:
                    brandno: simms
                    name: Simms
                unknownBrandno:
                  summary: Unknown brandno returns an empty object
                  value: {}
    patch:
      tags: [brands]
      operationId: patchBrand
      summary: Patch brand
      parameters:
        - name: brandno
          in: path
          required: true
          schema: { type: string }
          example: simms
          description: Brand id
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              name: x
      responses:
        "200":
          description: ok
  /api/brands/nosdk:
    get:
      tags: [brands]
      operationId: noSdkExample
      summary: No SDK method
      responses:
        "200":
          description: ok
components:
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          example:
            status: 401
            message: Authentication Required
  schemas:
    Brand:
      type: object
      description: |
        One brand as the dealer sees it.
      properties:
        id:
          type: integer
        brandno:
          type: string
          description: "Lowercase brand id | used as the brand filter."
        counts:
          type: object
          properties:
            total:
              type: integer
              description: Number of products.
        images:
          type: array
          items:
            type: object
            properties:
              small:
                type: string
        status:
          type: string
          enum: [active, hidden]
          nullable: true
          description: |
            Multi-line
            description.
        stock:
          oneOf:
            - type: string
            - type: integer
          description: Availability text or count.
        lines:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Line"
              - type: object
                properties:
                  qty:
                    type: integer
                    description: Quantity.
    Line:
      type: object
      properties:
        sku:
          type: string
          description: Article number.
