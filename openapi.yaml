    PosSale:
      type: object
      description: |
        Verified live from GET /api/pos/sales/ (15 records for the test
        account) and GET /api/pos/sales/?limit=2 (same shape, truncated).
        Properties are exactly the fields observed on every one of the 15
        records; none were missing across the set. Used both as the
        response shape for listPosSales/getPosSale and, per the Node SDK's
        posAddSale/posSales(add) usage, as the request body shape for the
        unverified addPosSale operation - see that operation's description.
      properties:
        id: { type: integer }
        dealer:
          type: integer
          description: Your dealer/account id.
        products:
          type: array
          description: |
            Line items included in the sale. Each item has the same shape
            as PosProduct, plus up to four sale-line-specific fields (qty,
            return, discount, comment) that were present on only 1 of the
            44 line items observed across the 15 probed sales - see each
            property's description below.
          items:
            allOf:
              - $ref: "#/components/schemas/PosProduct"
              - type: object
                properties:
                  qty:
                    type: string
                    description: |
                      Observed once, as the string "2". Not present on the
                      other 43 observed line items (each of those
                      represented a quantity of 1 as its own array entry
                      instead).
                  return:
                    type: boolean
                    description: Observed once, as false. Not present on the other 43 observed line items.
                  discount:
                    type: string
                    description: Observed once, as an empty string (""). Not present on the other 43 observed line items.
                  comment:
                    type: string
                    description: Observed once, as an empty string (""). Not present on the other 43 observed line items.
