    PosProduct:
      type: object
      description: |
        Verified live from GET /api/pos/products/ (17 records for the test
        account) and GET /api/pos/products/?limit=2 (same shape, truncated),
        plus the products embedded in GET /api/pos/sales/ sale records.
        Properties are exactly the fields observed; several are nullable or
        optional because the live data was inconsistent across records -
        see each property's description. brand is free text as entered at
        the point of sale, not the normalised brand slug used elsewhere in
        this API - observed casing/spelling varied: "scott", "simms",
        "Simms", "SIMMS FISHING PRODUCTS", "smith creek", "rodmount",
        "Guideline". Used both as the response shape for
        listPosProducts/getPosProduct and, per the Node SDK's
        posAddProduct/posEditProduct usage, as the request body shape for
        the unverified addPosProduct/updatePosProduct operations - see
        those operations' descriptions.
      properties:
        id:
          type: integer
          description: Point-of-sale product id (distinct from the catalog articleno).
        dealer:
          type: integer
          description: Your dealer/account id.
        articleno: { type: string }
        tradeItemNumber:
          type: string
          description: GTIN/EAN barcode.
        brand: { type: string }
        name: { type: string }
        inStock:
          type: integer
          description: |
            Observed only as negative integers (-1 to -7) across the 17
            probed records; the meaning is not documented by Flyfish
            Europe - do not assume this is a literal stock count.
        retailPrice: { type: number }
        retailCurrency: { type: string, example: NOK }
        tax: { type: integer, description: Tax rate in percent. }
        costPrice:
          type: number
          nullable: true
          description: Absent on 3 of the 17 probed records.
        category:
          type: string
          nullable: true
          description: Null on 1 of the 17 probed records.
        images:
          type: object
          nullable: true
          description: |
            Absent on 1 and null on 2 of the 17 probed records (3
            non-object cases in total). Unlike this API's shared Images
            schema, only small/medium/large were observed here - no
            xlarge, xxlarge or list.
          properties:
            small: { type: string }
            medium: { type: string }
            large: { type: string }
        uploadedFiles:
          type: array
          items: {}
          description: Observed as an empty array ([]) on every probed record; item shape not verified.
        color: { type: string, nullable: true }
        size: { type: string, nullable: true }
        itemCategory:
          type: string
          nullable: true
          description: Null on 1 of the 17 probed records.
        mainCategory:
          type: string
          nullable: true
          description: Null on 5 of the 17 probed records.
        intermediateCategory: { type: string, nullable: true }
        favorite: { type: boolean }
