        discountPercent:
          type: number
          description: Present on 2.0% of probed products (59/3024).
        pricelist:
          type: object
          additionalProperties: true
          description: |
            Internal price-list map, keyed by price-list number (e.g. "5",
            "44"). Entry shape varies - all 3 shapes were observed across the
            probed corpus: the full shape (prislistenr, artikkelnr, pris as a
            string e.g. "98.4", valutakode, startdato, sluttdato, hash), a
            partial shape with only prislistenr/pris/valutakode, or an empty
            object for a price list with no entry for this article.
        pricelistAsap:
          type: object
          additionalProperties: true
          description: |
            Same key structure as pricelist. Every entry observed here was
            in the full shape (prislistenr, artikkelnr, pris, valutakode,
            startdato, sluttdato, hash) - the partial and empty shapes seen
            on pricelist were not observed here, though a larger sample
            might still show them.
        pricelistPresale:
          type: object
          additionalProperties: true
          description: |
            Same key structure as pricelist. Entry shape varies: most
            entries carry only pris (a number here, not a string) and
            valutakode, but the full pricelist shape (prislistenr,
            artikkelnr, pris, valutakode, startdato, sluttdato, hash) was
            also observed here (e.g. articleno 12023-016-07's price-list 5
            and 44 entries), as was an empty object.
        pricelistPresaleAsap:
          type: object
          additionalProperties: true
          description: |
            Same key structure as pricelistPresale. Every entry observed
            here was either the pris+valutakode shape or an empty object -
            the full pricelist shape seen on pricelistPresale was not
            observed here.
        pricelistCombo:
          type: object
          additionalProperties: true
          description: |
            Rare (present on 1.4% of probed products, 43/3024): a flat
            object mirroring priceNOK/priceSEK/priceDKK/priceGBP/priceEUR/
            priceCHF, seen on combo/bundle articles.
        images:
          $ref: "#/components/schemas/Images"
        imgs:
          type: object
          additionalProperties: true
          description: |
            Raw upload metadata for each image, keyed by a small integer id.
            Each entry has name, encoding, mimetype, ext, newFilename, s3Link,
            s3ThumbLink, bytes and sort. images is the derived, ready-to-use
            form of this data. Present on 95.7% of probed products
            (2894/3024) - note this is notably less than images (100%, see
            below), i.e. some products have images without raw imgs metadata.
        files:
          type: object
          additionalProperties: true
          description: |
            Same shape as imgs, but for non-image attachments (video files
            were the only kind observed). Rare - present on 0.8% of probed
            products (24/3024).
        imageRefPrefixes:
          type: object
          properties:
            small: { type: string }
            medium: { type: string }
            large: { type: string }
            xlarge: { type: string }
            xxlarge: { type: string }
          description: URL prefix for each image size, without the filename.
