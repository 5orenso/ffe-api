  /api/brands/{brandno}:
    get:
      tags: [brands]
      operationId: getBrand
      summary: Get one brand
      x-sdk-node: "ffe.brand('simms')"
      x-sdk-php: "$ffe->brand('simms')"
      parameters:
        - name: brandno
          in: path
          required: true
          schema:
            type: string
          example: simms
      responses:
        "200":
          description: |
            The brand. An unknown brandno also returns HTTP 200 (not 404), but with
            an empty object body — see the unknownBrandno example.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
              examples:
                simms:
                  summary: Known brandno
                  value:
                    id: 2
                    brandno: simms
                    sort: 10
                    name: Simms
                    fullName: Simms
                    count: 2457
                    countPresale: 514
                    updatedDate: "2023-06-20T12:33:51.583Z"
                    showOnConsumerWeb: 1
                    showOnDealerWeb: 1
                    countNew: 1095
                    countPsNew: 163
                    countSpring: 1459
                    countFall: 1163
                    countPsSpring: 30
                    countPsFall: 484
                    countNewSpring: 498
                    countNewFall: 597
