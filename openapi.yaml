  /api/products/:
    get:
      tags: [products]
      operationId: listProducts
      summary: List or search products
      description: |
        Returns individual product variants (one entry per articleno / colour /
        size combination), not grouped product families - see the unique
        parameter below. The default, unfiltered response is not scoped to one
        brand: 22 different brandno values were observed across a single
        1000-item probe.
      x-sdk-node: "ffe.products({ brand: 'simms', limit: 50, offset: 0 })"
      x-sdk-php: "$ffe->products((object) ['brand' => 'simms', 'limit' => 50, 'offset' => 0])"
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 25 }
          description: |
            Number of products to return. Verified default is 25: an
            unfiltered request with no limit given returned exactly 25 items.
            No upper cap was found - limit=1000 returned 1000 items and
            limit=3000 returned 3000 items, both un-truncated.
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: |
            Pagination offset. Verified: limit=2&offset=0 returned articleno
            1113000, 1113001; limit=2&offset=2 returned 1113002, 1113003 - the
            next two items in the same order.
        - name: brand
          in: query
          schema: { type: string }
          example: simms
          description: |
            brandno from /api/brands/. Verified: brand=simms returned only
            brandno "Simms" items, a strict subset of the multi-brand
            unfiltered list.
        - name: maingroup
          in: query
          schema: { type: string }
          example: simms headwear
          description: |
            Case-insensitive exact match against "<brandno> <maingroupname>"
            (e.g. brand simms + maingroupname "Headwear" -> "simms headwear").
            Verified: maingroup=simms%20headwear and maingroup=Simms%20Headwear
            both returned the same 2 Headwear/Simms items; maingroup=headwear
            (no brand prefix) returned zero results, so the brand prefix is
            required for this parameter (unlike intgroup/subgroup below).
        - name: intgroup
          in: query
          schema: { type: string }
          example: beanies
          description: |
            Case-insensitive exact match against intermediategroupname, with
            no brand prefix. Verified: intgroup=beanies and intgroup=BEANIES
            both matched the Simms Headwear > Beanies group; the partial value
            intgroup=bean matched nothing (exact match, not substring); the
            brand-prefixed intgroup=simms%20beanies also matched nothing.
        - name: subgroup
          in: query
          schema: { type: string }
          example: wms g3 stockingfoots
          description: |
            Case-insensitive exact match against subgroupname, with no brand
            prefix - same pattern as intgroup. Verified:
            subgroup=wms%20g3%20stockingfoots matched all 13 items of that
            Simms Women's > Waders > Wms G3 Stockingfoots sub-group.
        - name: mainCat
          in: query
          schema: { type: integer }
          example: 101
          description: |
            maingroupno. Verified: mainCat=101 returned only maingroupno 101
            (Simms Waders) items.
        - name: intCat
          in: query
          schema: { type: integer }
          example: 1033
          description: |
            intermediategroupno. Verified: intCat=1033 returned only
            intermediategroupno 1033 (Simms Headwear > Beanies) items.
        - name: subCat
          in: query
          schema: { type: integer }
          example: 10096
          description: |
            subgroupno. Verified: subCat=10096 returned only subgroupno 10096
            (Simms Women's > Waders > Wms G3 Stockingfoots) items.
        - name: gtin
          in: query
          schema: { type: string }
          example: "4560111388931"
          description: |
            tradeItemNumber (barcode), exact match. Verified with two real
            values: gtin=782420002818 returned exactly the one Loon item with
            that tradeItemNumber, and gtin=4560111388931 returned exactly the
            one C&F item (articleno 1113000) with that tradeItemNumber.
        - name: articleNoIn
          in: query
          schema: { type: string }
          example: "1113000,1113001"
          description: |
            Comma-separated list of articleno values. Verified:
            articleNoIn=1113000,1113001 returned both matching items, in that
            order.
        - name: search
          in: query
          schema: { type: string }
          example: simms waders
          description: |
            Free-text search. Verified: search=simms%20waders returned a
            different, narrower result set than the unfiltered list (a Simms
            wader product, versus the unfiltered list's unrelated top items).
        - name: unique
          in: query
          schema: { type: boolean, default: false }
          description: |
            Documented (and implied by every product's own
            apiLinkToProductGroup, which always appends &unique=true) to group
            size/colour variants into one product with sizes, colors and
            imgRef arrays. NOT verified live: every combination tried
            (unique=true alone; with limit=1; narrowed to a single item via
            mainCat, brand, gtin, articleNoIn or nameDisplay) consistently
            returned HTTP 504 Gateway Timeout with an empty body. unique=false
            was verified to behave identically to omitting the parameter.
        - name: isNew
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: |
            Filters on the is_new flag. Verified in both directions:
            isNew=1 returned only is_new: 1 items and isNew=0 returned only
            is_new: 0 items.
        - name: nameDisplay
          in: query
          schema: { type: string }
          example: 30th Anniversary Boat Box
          description: |
            Exact match against nameDisplay. Works without unique=true, and
            returns every colour/size variant sharing that marketing name (not
            just one). Verified: nameDisplay=Bales%20Beach%20-%20Polycarbonate
            returned all 17 variants sharing that nameDisplay.
      responses:
        "200":
          description: |
            Array of product variants (not grouped into product families -
            see the unique parameter). Example trimmed for readability (long
            text fields shortened, large maps/lists cut); the schema is
            authoritative.
          content:
            application/json:
              schema:
                type: array
                items:
