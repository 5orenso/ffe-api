        linkname:
          type: string
    Product:
      type: object
      description: |
        One product variant (a single articleno / colour / size combination),
        as returned by GET /api/products/ and GET /api/products/{articleno}.
        Field list is the observed union across every scripts/probes/prod-*.json
        body, deduplicated by articleno (3024 distinct products; 4306 raw,
        pre-dedup occurrences). Not every field is present on every item -
        every percentage below was computed by a script over that
        deduplicated corpus (a field counts as present for an articleno if
        ANY probed occurrence of that articleno had it), not eyeballed. The
        sizes, colors and imgRef fields are documented from the pre-existing
        spec draft and from apiLinkToProductGroup's own use of unique=true,
        but could NOT be verified live: every unique=true probe returned
        HTTP 504.
      properties:
        id:
          type: integer
        articleno:
          type: string
        tradeItemNumber:
          type: string
          description: GTIN / barcode. Matches the gtin query parameter.
        name:
          type: string
        nameDisplay:
          type: string
          description: Marketing name shared by all colour/size variants of a product family. Matches the nameDisplay query parameter.
        productGroup:
          type: string
        brand:
          type: string
          description: Lowercase brand slug, e.g. "simms".
        brandno:
          type: string
          description: Brand identifier as seen elsewhere in the catalog, e.g. "Simms", "C&F", "Loon". Casing is inconsistent with Brand.brandno (which is lowercase); matching against the brand query parameter is case-insensitive.
        vismaBrand:
          type: string
          description: Brand name as stored in the upstream Visma ERP, e.g. "C&F Design".
        itemCategory:
          type: string
          description: |
            Short internal category code/name. Often distinct from
            mainCategory (e.g. itemCategory "HEAD" alongside mainCategory
            "Headwear"), but not always: 522 of 4306 raw (non-deduplicated)
            occurrences had itemCategory equal to mainCategory (e.g.
            articleno F0281: itemCategory "Floatants", mainCategory
            "Floatants").
        mainCategory:
          type: string
          description: Same value as maingroupname.
        intermediateCategory:
          type: string
          description: |
            Same value as intermediategroupname. Present on 87.1% of probed
            products (2634/3024) - in every case but one, exactly when
            intermediategroupno is non-zero (see intermediategroupno).
        subCategory:
          type: string
          description: |
            Same value as subgroupname. Present on 55.5% of probed products
            (1677/3024), exactly when subgroupno is non-zero (0 exceptions
            observed - see subgroupno).
        maingroupno:
          type: integer
          description: Matches the mainCat query parameter.
        maingroupname:
          type: string
        maingroupid:
          type: integer
        maingroupsort:
          type: integer
          nullable: true
        intermediategroupno:
          type: integer
          description: |
            Matches the intCat query parameter. 0 when the product has no
            intermediate group, with one observed exception: articleno
            12023-016-07 had intermediategroupno: 0 but a fully-populated
            intermediategroupname/intermediategroupid/intermediategroupsort/
            intermediateCategory anyway.
        intermediategroupname:
          type: string
          description: |
            Present on 87.1% of probed products (2634/3024) - in every case
            but one, exactly when intermediategroupno is non-zero (see
            intermediategroupno).
        intermediategroupid:
          type: integer
          description: Present on 87.1% of probed products (2634/3024); same conditions as intermediategroupname.
        intermediategroupsort:
          type: integer
          nullable: true
          description: |
            Present on 86.9% of probed products (2629/3024). Never present
            when intermediategroupno is 0, but not quite universal when it
            isn't either: of the 3417 raw (non-deduplicated) occurrences with
            a non-zero intermediategroupno, 5 were missing this field.
        subgroupno:
          type: integer
          description: Matches the subCat query parameter. 0 when the product has no sub group.
        subgroupname:
          type: string
          description: |
            Present on 55.5% of probed products (1677/3024), exactly when
            subgroupno is non-zero (0 exceptions observed).
        subgroupid:
          type: integer
          description: Present on 55.5% of probed products (1677/3024); same conditions as subgroupname.
        subgroupsort:
          type: integer
          nullable: true
          description: |
            Present on 47.4% of probed products (1434/3024). Never present
            when subgroupno is 0, but far from universal when it isn't:
            of the 2004 raw (non-deduplicated) occurrences with a non-zero
            subgroupno, 243 (12%) were missing this field.
        sort:
          type: integer
          nullable: true
          description: Present on 44.6% of probed products (1348/3024).
        color:
          type: string
        colorId:
          type: integer
        size:
          oneOf:
            - type: string
            - type: boolean
          description: |
            The variant's size label, or false (observed on 12.3% of probed
            products, 373/3024, and always false when boolean - never true)
            when the product has no size dimension.
        sizeId:
          type: integer
        option_1:
          type: string
          description: |
            Free-form variant option (e.g. frame colour on sunglasses);
            empty string when unused. Not always paired with option_1_name:
            95 raw occurrences had an empty option_1 with a non-empty
            option_1_name (e.g. articleno 13785-001-00: option_1: "",
            option_1_name: "color").
        option_1_name:
          type: string
          description: Label for option_1, e.g. "frame color"; empty string when unused (see option_1 for observed pairing exceptions).
        option_2:
          type: string
          description: |
            Free-form variant option (e.g. lens colour on sunglasses);
            empty string when unused. Not always paired with
            option_2_name: 130 raw occurrences had a non-empty option_2 with
            an empty option_2_name (e.g. articleno C1195-10: option_2:
            "Black Nickel", option_2_name: "").
        option_2_name:
          type: string
          description: Label for option_2, e.g. "lens color"; empty string when unused (see option_2 for observed pairing exceptions).
        description:
          type: string
          description: Present on 97.4% of probed products (2944/3024).
        descriptionHtml:
          type: string
          description: HTML version of description. Rare - present on only 1 of 3024 distinct products probed.
        features:
          type: string
          description: Bullet list as plain text. Present on 59.4% of probed products (1795/3024).
        care:
          type: string
          description: Care instructions as plain text. Present on 32.9% of probed products (996/3024).
        tech:
          type: string
          description: Free-form markdown, sometimes just an embedded image reference. Present on 27.6% of probed products (834/3024).
        howtouse:
          type: string
          description: Present on 8.0% of probed products (241/3024).
        introYear:
          type: string
          description: e.g. "S26" or "S22-S26" (a range), not always a plain year.
        isActive:
          type: integer
        is_new:
          type: integer
          description: 0 or 1. Matches the isNew query parameter.
        isMoving:
          type: boolean
          description: Present on 32.7% of probed products (989/3024).
        showonwebyesno:
          type: integer
        showOnConsumerWeb:
          type: integer
        preSale:
          type: integer
        preSaleNew:
          type: integer
        preSalePopular:
          type: integer
        preSaleDiscontinued:
          type: integer
        status:
          type: integer
          description: Present on 15.4% of probed products (467/3024).
        offline:
          type: integer
          description: Present on 15.4% of probed products (467/3024).
        availability:
          oneOf:
            - type: string
            - type: number
          description: |
            Present on all 3024 distinct products probed (100%). Observed
            patterns: "Yes" = in stock; "No" = out of stock; a date string in
            D.M.YY / DD.MM.YY form (e.g. "02.01.27", "04.06.26", "15.12.26",
            "22.12.25", "01.01.40") = expected restock date; "20+" = in
            stock, at least 20 units; a plain number (1-19 observed) = in
            stock with that exact quantity. Note the date format is
            day.month.year, not ISO YYYY-MM-DD.
        unitsInStock:
          type: integer
        unitsInStockHasMore:
          type: boolean
          description: |
            Present on all 3024 distinct products probed (100%) by at least
            one occurrence. However, on the one single-item
            GET /api/products/{articleno} response probed (articleno
            1113000), this field was absent from that specific response even
            though 9 other, list-endpoint occurrences of the same articleno
            all included it - the two endpoints may not return exactly the
            same field set.
        weight:
          type: number
        packingWeight:
          type: number
        volume:
          type: number
        length:
          type: number
        width:
          type: number
        height:
          type: number
        countryOfOrigin:
          type: string
          description: Numeric country code as a string, e.g. "392".
        countryCode:
          oneOf:
            - type: string
            - type: boolean
          description: |
            false on 84.6% of probed products (2557/3024); a 2-letter,
            uppercase ISO-3166-1-alpha-2-style country code string on the
            other 15.4% (467/3024). Observed string values: CN, JP, NZ, SV,
            TW, US, VN, ZA. Always paired with a matching country value (see
            below) - never a string on one and boolean on the other for the
            same product.
        country:
          oneOf:
            - type: string
            - type: boolean
          description: |
            false on 84.6% of probed products (2557/3024); an uppercase
            country name string on the other 15.4% (467/3024), paired
            1:1 with countryCode. Observed string values: CHINA, EL SALVADOR,
            JAPAN, NEW ZEALAND, "SØR-AFRIKA" (Norwegian for South Africa,
            paired with countryCode ZA), TAIWAN, USA, VIETNAM.
        commodityCode:
          type: string
        retailCurrency:
          type: string
        retailPrice:
          type: number
          description: Present on ~99.9% of probed items.
        psRetailCurrency:
          type: string
          description: Pre-sale retail currency.
        psRetailPrice:
