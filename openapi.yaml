openapi: 3.0.3
info:
  title: Flyfish Europe Dealer API
  version: "1.0.0"
  description: |
    JSON REST API for Flyfish Europe dealers with DealerWeb access.
    Create an API token in DealerWeb under My Account and send it as
    `Authorization: Bearer <token>` on every request.
servers:
  - url: https://dealer.flyfisheurope.com
    description: Production (DealerWeb)
tags:
  - name: login
  - name: brands
  - name: categories
  - name: products
  - name: baskets
  - name: dealers
  - name: pos-sales
  - name: pos-products
paths:
  /login/:
    post:
      tags: [login]
      operationId: login
      x-verified: false
      summary: Exchange email and password for an API token
      description: |
        Only needed if you do not want to create a token in DealerWeb.
        The returned apiToken is used as the Bearer token for all other calls.
        Not yet verified against the live API; request encoding and response examples come from the PHP and Node SDKs.
      security: []
      x-sdk-node: "ffe.login('you@example.com', 'password')"
      x-sdk-php: "$ffe->login('you@example.com', 'password')"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: you@example.com
              pass: your-password
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: you@example.com
              pass: your-password
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                status: 200
                apiToken: "<jwt>"
                message: OK
        "401":
          description: Login failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 401
                message: Login failed
  /api/brands/:
    get:
      tags: [brands]
      operationId: listBrands
      summary: List all brands available to your dealer account
      description: |
        Supports CORS preflight (OPTIONS): allowed methods GET, HEAD, PUT, PATCH, POST, DELETE.
        The live OPTIONS probe did not return an access-control-allow-headers value
        (no Access-Control-Request-Headers was sent on the preflight request).
      x-sdk-node: "ffe.brands()"
      x-sdk-php: "$ffe->brands()"
      responses:
        "200":
          description: Array of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
              example:
                - id: 2
                  brandno: simms
                  sort: 10
                  name: Simms
                  fullName: Simms
                  count: 2457
                  countPresale: 514
                  updatedDate: "2023-06-20T12:33:51.583Z"
                  showOnConsumerWeb: 1
                  showOnDealerWeb: 1
                  countNew: 1095
                  countPsNew: 163
                  countSpring: 1459
                  countFall: 1163
                  countPsSpring: 30
                  countPsFall: 484
                  countNewSpring: 498
                  countNewFall: 597
                  countPsNewSpring: 0
                  countPsNewFall: 163
                - id: 68
                  brandno: ahrex
                  sort: 15
                  name: Ahrex
                  fullName: Ahrex
                  count: 597
                  countPresale: 609
                  updatedDate: "2023-10-17T11:09:47.679Z"
