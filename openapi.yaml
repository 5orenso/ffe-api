                    countPsNewFall: 163
                unknownBrandno:
                  summary: Unknown brandno returns an empty object
                  value: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/categories/:
    get:
      tags: [categories]
      operationId: listCategories
      summary: List categories
      description: |
        Without a `level` filter, this dealer account's response is identical (same 13
        items, same order) to `level=main` and to `brand=simms`: every category this
        token can see by default is a main-level Simms category. Intermediate and sub
        categories are only returned when `level=intermediate` or `level=sub` is
        requested explicitly.
      x-sdk-node: "ffe.categories({ brand: 'simms', level: 'main' })"
      x-sdk-php: "$ffe->categories((object) ['brand' => 'simms', 'level' => 'main'])"
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
          description: |
            Maximum number of categories to return. The default of 100 is inferred:
            `level=intermediate` (170+ candidate categories) returned exactly 100 items
            with no limit given, a round number consistent with a page-size cap, while
            `level=sub` (57 total) and the unfiltered/`level=main` call (13 total) both
            came back under 100 and were not capped.
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: |
            Pagination offset into the result list (ordered by `sort`). Verified:
            `limit=2&offset=0` returned categoryno 101, 102; `limit=2&offset=2`
            returned categoryno 104, 105 - the next two items in `sort` order.
        - name: brand
          in: query
          schema: { type: string }
          example: simms
          description: |
            Intended to filter by brand identifier (matches Brand.brandno). Not
            conclusively verified: `brand=simms` returned results byte-identical to
            the unfiltered list (same 13 categories), but every category this dealer
            account can see is already brand simms, so this probe cannot distinguish
            "brand filters and simms matched everything" from "brand has no effect".
            Case-sensitivity was not tested.
        - name: level
          in: query
          schema:
            type: string
            enum: [main, intermediate, sub]
          description: |
            main returned 13 categories (parent: null), intermediate returned 100
            (likely capped by the default limit - see limit), sub returned 57, all
            with a non-null parent.
        - name: parent
          in: query
          schema: { type: integer }
          example: 101
          description: |
            Only categories whose parent equals this categoryno. Verified:
            parent=101 returned 14 categories, all level intermediate and all with
            parent: 101.
      responses:
        "200":
          description: Array of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
              example:
                - categoryno: 101
                  id: 7321
                  groupno: 101
                  name: Simms Waders
                  level: main
                  parent: null
                  sort: 1
                  status: 2
                  showOnConsumerWeb: 1
                  preSale: 1
                  products: []
                  articles:
                    - id: 2937
                      text: "2937: Simms Wader Sizechart"
                      title: Simms Wader Sizechart
                  categories: []
                  offline: 0
                  count: 159
                  countPresale: 0
                  countNew: 0
                  countPsNew: 0
                  countSpring: 139
                  countFall: 20
                  countPsSpring: 0
                  countPsFall: 0
                  countNewSpring: 0
                  countNewFall: 0
                  countPsNewSpring: 0
                  countPsNewFall: 0
                  brand: simms
                  linkname: Waders
                - categoryno: 102
                  id: 7320
                  groupno: 102
                  name: Simms Footwear
                  level: main
                  parent: null
                  sort: 2
                  status: 2
                  showOnConsumerWeb: 1
                  preSale: 1
                  hasNewProducts: 1
                  hasPresaleProducts: 1
                  articles: []
                  offline: 0
                  count: 207
                  countPresale: 32
                  countNew: 8
                  countPsNew: 0
                  countSpring: 152
                  countFall: 55
                  countPsSpring: 10
                  countPsFall: 22
                  countNewSpring: 8
                  countNewFall: 0
                  countPsNewSpring: 0
                  countPsNewFall: 0
                  brand: simms
                  linkname: Footwear
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/categories/{categoryno}:
    get:
      tags: [categories]
