        apiLinkToProductMainCategory:
          type: string
          description: Self-referential /api/products/?mainCat=...&unique=true URL for this product's main category.
        related:
          type: object
          description: |
            Cross-references; empty object/empty arrays on most items, but
            all 3 sub-fields have real, non-empty data on a minority of
            products: articles on 6.5% (196/3024, e.g. a wader size-chart
            article), products on 1.4% (42/3024) and categories on 0.2%
            (7/3024).
          properties:
            articles:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  title: { type: string }
                  text:
                    type: string
                    description: Present on some, but not all, related.articles entries.
              description: |
                e.g. {"id": 3531, "title": "Simms G4Z_2024 Size Chart"} or
                {"id": 2963, "text": "2963: Simms Women's G3 Wader Size Chart", "title": "..."}.
            products:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  articleno: { type: string }
              description: |
                e.g. {"id": 619648, "name": "Magnitude Infinity Buckskin/10' Clear Tip WF-3", "articleno": "145213"}.
            categories:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  text: { type: string }
              description: |
                e.g. {"id": 7362, "text": "365: SA Accessories", "name": "SA Accessories"}.
        articlesTech:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              text: { type: string }
              title: { type: string }
          description: Rare - present on only 1 of 3024 distinct products probed.
        supplierOrderLines:
          type: array
          items:
            type: array
            description: A [date string, positive integer] tuple, e.g. ["2027-01-02", 12].
          description: |
            Incoming purchase-order lines. Non-empty on 13.9% of probed
            products (419/3024); an empty array otherwise. Every non-empty
            entry observed was a 2-element [date string, integer] tuple, and
            the integer was always positive across every occurrence in the
            probed corpus (424 distinct entries; range 1-804, e.g.
            ["2027-01-02", 12]) - no negative or zero quantity was ever seen.
        customerOrderLines:
          type: array
          items:
            type: array
            description: A [date string, negative integer] tuple, e.g. ["2026-09-09", -1].
          description: |
            Outstanding customer-order lines. Non-empty on 13.6% of probed
            products (411/3024); an empty array otherwise. Same tuple shape
            as supplierOrderLines, but the integer was always negative across
            every occurrence in the probed corpus (513 distinct entries;
            range -50 to -1, e.g. ["2026-09-09", -1]) - no positive or zero
            quantity was ever seen.
        warehouse:
          type: string
        updatedFields:
          type: object
          additionalProperties: true
          description: |
            Internal change-tracking metadata: maps field names (including
