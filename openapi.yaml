                including secondary/legacy addresses). Each entry is a
                per-login-email activity record: activity, forgotten
                (array), forgottens, last_activity, last_forgotten,
                last_login, login, login_failed, logins (array of Unix
                timestamps), logins_failed (array), newsletter,
                newsletter_subscribed, newsletter_subscribed_from,
                newsletter_subscribed_user_agent, visits,
                last_login_failed, current_login_failed, isOnline (boolean),
                api_activity, last_api_activity, isOnlineApi (boolean).
