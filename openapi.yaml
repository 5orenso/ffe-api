components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            status: 401
            message: "Invalid JwtToken: UnauthorizedError"
            reason: jwt malformed
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        reason:
          type: string
          description: Present on some error responses, e.g. token validation failures.
    LoginRequest:
      type: object
      required: [email, pass]
      properties:
        email:
          type: string
          format: email
        pass:
          type: string
    LoginResponse:
      type: object
      properties:
        status:
          type: integer
        apiToken:
          type: string
        message:
          type: string
    Brand:
      type: object
      properties:
        id:
          type: integer
        brandno:
          type: string
          description: Brand identifier used in the brand query parameter elsewhere
        sort:
          type: integer
        name:
          type: string
        fullName:
          type: string
        count:
          type: integer
        countPresale:
          type: integer
        updatedDate:
          type: string
          format: date-time
        showOnConsumerWeb:
          type: integer
        showOnDealerWeb:
          type: integer
        countNew:
          type: integer
        countPsNew:
          type: integer
        countSpring:
          type: integer
        countFall:
          type: integer
        countPsSpring:
          type: integer
        countPsFall:
          type: integer
        countNewSpring:
          type: integer
        countNewFall:
          type: integer
        countPsNewSpring:
          type: integer
        countPsNewFall:
          type: integer
    Category:
      type: object
      properties:
        categoryno:
          type: integer
        id:
          type: integer
        groupno:
          type: integer
          description: Always equal to categoryno in observed data.
        name:
          type: string
        level:
          type: string
          enum: [main, intermediate, sub]
        parent:
          type: integer
          nullable: true
          description: categoryno of the parent category; null for level main.
        sort:
          type: integer
        status:
          type: integer
        showOnConsumerWeb:
          type: integer
        preSale:
          type: integer
        hasNewProducts:
          type: integer
        hasPresaleProducts:
          type: integer
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              articleno:
